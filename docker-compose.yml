services:

  api:
    build:
      context: ./api
    restart: unless-stopped
    environment:
      API_WORKERS: ${API_WORKERS:-2}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\" || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"