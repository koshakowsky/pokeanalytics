services:

  api:
    build:
      context: ./api
    restart: unless-stopped
    environment:
      API_WORKERS: ${API_WORKERS:-2}
      # SQLite DB lives on a named volume so data survives container restarts.
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/pokeanalytics.db}
      # Explicit CORS origins (wildcard + credentials is invalid).
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:3000}
      # Set this to enable the protected /api/admin/seed endpoint.
      SEED_TOKEN: ${SEED_TOKEN:-}
      # Auto-seed the DB on first boot when empty (keeps the demo self-contained).
      AUTO_SEED: ${AUTO_SEED:-1}
      AUTO_SEED_MAX: ${AUTO_SEED_MAX:-151}
    volumes:
      - api_data:/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\" || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"

volumes:
  api_data:
